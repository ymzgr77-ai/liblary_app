<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図書貸出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:      #0f1117;
    --surface: #181c27;
    --surface2:#1f2435;
    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold:    #c9a84c;
    --gold2:   #e8c96a;
    --ink:     #e8e4d9;
    --ink2:    rgba(232,228,217,0.55);
    --ink3:    rgba(232,228,217,0.3);
    --green:   #4e9e6e;
    --red:     #c0524a;
    --blue:    #4a7fa5;
    --shadow:  rgba(0,0,0,0.4);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Serif JP',serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:clip;}

  /* 背景グレイン */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;opacity:.6;
  }

  .app-wrap{max-width:480px;margin:0 auto;padding:28px 20px 72px;position:relative;z-index:1;}

  /* ── ヘッダー ── */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;padding-bottom:20px;border-bottom:1px solid var(--border2);}
  .header-left{display:flex;flex-direction:column;gap:3px;}
  .header-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;letter-spacing:.08em;line-height:1;color:var(--gold2);}
  .header-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .header-mgmt,.sync-btn{
    padding:6px 13px;border:1px solid var(--border2);border-radius:2px;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;
    color:var(--ink3);cursor:pointer;background:transparent;transition:all .18s;
  }
  .header-mgmt:hover,.sync-btn:hover{border-color:var(--gold);color:var(--gold);}
  .sync-btn.syncing{color:var(--gold);border-color:var(--gold);}

  /* ── パンくず ── */
  .breadcrumb{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);margin-bottom:22px;letter-spacing:.08em;min-height:16px;}
  .breadcrumb span{cursor:pointer;transition:color .15s;}
  .breadcrumb span:hover{color:var(--gold);}
  .breadcrumb .sep{opacity:.3;}
  .breadcrumb .current{color:var(--ink2);font-weight:500;}

  .section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ── 所有者カード ── */
  .owner-card{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;background:var(--surface);
    border:1px solid var(--border);border-radius:3px;
    margin-bottom:8px;cursor:pointer;transition:all .2s;
  }
  .owner-card:hover{border-color:var(--gold);background:var(--surface2);transform:translateX(4px);}
  .owner-name{font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--ink);}
  .owner-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);}
  .owner-arrow{color:var(--gold);font-size:13px;opacity:.7;margin-left:8px;}

  /* ── 本カード ── */
  .book-card{
    display:flex;align-items:center;gap:14px;
    padding:13px 16px;background:var(--surface);
    border:1px solid var(--border);border-radius:3px;
    margin-bottom:8px;cursor:pointer;transition:all .2s;
  }
  .book-card:hover{border-color:var(--gold);background:var(--surface2);transform:translateX(4px);}
  .book-thumb{width:44px;height:60px;border-radius:2px;border:1px solid var(--border2);flex-shrink:0;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:2px 2px 8px rgba(0,0,0,.4);}
  .book-thumb img,.book-thumb svg{width:100%;height:100%;object-fit:cover;}
  .book-info{flex:1;min-width:0;}
  .book-title{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;color:var(--ink);}
  .book-title .title-text{display:inline-block;white-space:nowrap;transform:translateZ(0);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  .book-author{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .book-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);}
  .book-stars{color:var(--gold);letter-spacing:1px;}

  /* ── バッジ ── */
  .badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;padding:3px 9px;border-radius:2px;flex-shrink:0;text-transform:uppercase;}
  .badge.available{background:rgba(78,158,110,.12);color:#6ec491;border:1px solid rgba(78,158,110,.25);}
  .badge.borrowed{background:rgba(192,82,74,.1);color:#e07a72;border:1px solid rgba(192,82,74,.22);}

  /* ── 詳細画面 ── */
  .detail-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:32px 26px;box-shadow:0 4px 24px rgba(0,0,0,.3);}
  .detail-cover-wrap{display:flex;justify-content:center;margin-bottom:28px;}
  .detail-cover{
    width:108px;height:148px;border-radius:3px;border:1px solid var(--border2);
    background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:44px;
    box-shadow:6px 6px 24px rgba(0,0,0,.5),-1px -1px 0 rgba(201,168,76,.15);overflow:hidden;
  }
  .detail-cover img,.detail-cover svg{width:100%;height:100%;object-fit:cover;}
  .detail-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;text-align:center;margin-bottom:5px;line-height:1.4;color:var(--ink);}
  .detail-author{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);text-align:center;margin-bottom:6px;}
  .detail-owner{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);text-align:center;margin-bottom:16px;letter-spacing:.08em;}
  .detail-divider{border:none;border-top:1px solid var(--border);margin:22px 0;}
  .detail-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .detail-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;}
  .detail-value{font-weight:600;font-size:14px;color:var(--ink);}

  /* ── ボタン ── */
  .btn-group{display:flex;gap:10px;margin-top:26px;}
  .btn{flex:1;padding:13px 0;border:none;border-radius:2px;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:all .18s;}
  .btn-primary{background:var(--gold);color:#0f1117;}
  .btn-primary:hover{background:var(--gold2);}
  .btn-primary:disabled{background:var(--surface2);color:var(--ink3);cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--ink2);border:1px solid var(--border2);}
  .btn-secondary:hover{border-color:var(--ink2);color:var(--ink);}
  .btn-secondary:disabled{color:var(--ink3);border-color:var(--border);cursor:not-allowed;}
  .btn-danger{background:transparent;color:rgba(192,82,74,.7);border:1px solid rgba(192,82,74,.2);}
  .btn-danger:hover{background:rgba(192,82,74,.08);color:var(--red);border-color:rgba(192,82,74,.4);}
  .delete-zone{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:center;}
  .btn-delete-sm{padding:7px 18px;border:1px solid rgba(192,82,74,.18);border-radius:2px;background:none;color:rgba(192,82,74,.45);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
  .btn-delete-sm:hover{background:rgba(192,82,74,.08);color:var(--red);border-color:rgba(192,82,74,.35);}
  .btn-back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;padding:0;background:none;border:none;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);cursor:pointer;letter-spacing:.08em;transition:color .15s;}
  .btn-back:hover{color:var(--gold);}

  /* ── 入力フォーム ── */
  .input-wrap{margin-top:18px;display:none;}
  .input-wrap.visible{display:block;}
  .input-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;}
  .input-field{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:2px;font-family:'Noto Serif JP',serif;font-size:14px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s;}
  .input-field:focus{border-color:var(--gold);}
  .input-field::placeholder{color:var(--ink3);}
  textarea.input-field{resize:none;line-height:1.7;}

  .empty-state{text-align:center;padding:56px 0;color:var(--ink3);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;line-height:2.2;}

  /* ── 本登録ボタン ── */
  .add-book-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:20px;padding:14px 0;
    border:1px dashed rgba(201,168,76,.25);border-radius:3px;
    cursor:pointer;color:rgba(201,168,76,.45);
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;
    transition:all .2s;background:transparent;width:100%;
  }
  .add-book-bar:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.04);}

  /* ── トースト ── */
  .toast{
    position:fixed;bottom:32px;left:50%;
    transform:translateX(-50%) translateY(80px);
    background:var(--surface2);color:var(--ink2);
    border:1px solid var(--border2);
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;
    padding:10px 20px;border-radius:2px;opacity:0;
    transition:all .3s;white-space:nowrap;z-index:300;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .screen{animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none!important;}

  /* ── ローディング ── */
  .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:500;}
  .loading-screen.hidden{display:none!important;}
  .loading-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--gold2);letter-spacing:.1em;}
  .loading-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.14em;}
  .loading-spinner{width:28px;height:28px;border:1.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── モーダル ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:overlayIn .2s ease;}
  .modal-overlay.hidden{display:none!important;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal-sheet{background:var(--surface);width:100%;max-width:480px;border-radius:8px 8px 0 0;padding:28px 24px 48px;animation:sheetUp .28s cubic-bezier(.16,1,.3,1);max-height:92vh;overflow-y:auto;border-top:1px solid var(--border2);}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-handle{width:32px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 24px;}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:.05em;color:var(--ink);}
  .modal-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);margin-bottom:20px;letter-spacing:.08em;}

  /* ── スキャナー ── */
  #qr-reader{width:100%;border-radius:6px;overflow:hidden;margin-bottom:12px;background:#000;}
  #qr-reader__scan_region{border-radius:6px;overflow:hidden;}
  #qr-reader__dashboard{padding:8px 0 0!important;background:transparent!important;border:none!important;}
  #qr-reader__dashboard_section_swaplink{display:none!important;}
  #qr-reader__status_span{font-family:'DM Mono',monospace!important;font-size:10px!important;color:var(--ink3)!important;}
  #qr-reader__camera_selection{width:100%!important;padding:8px 10px!important;border:1px solid var(--border2)!important;border-radius:2px!important;font-family:'Noto Serif JP',serif!important;font-size:13px!important;background:var(--surface2)!important;color:var(--ink)!important;margin-bottom:8px!important;outline:none!important;}
  #qr-reader__camera_permission_button,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{padding:10px 0!important;width:100%!important;border:none!important;border-radius:2px!important;font-family:'Noto Serif JP',serif!important;font-size:14px!important;font-weight:600!important;cursor:pointer!important;background:var(--gold)!important;color:#0f1117!important;margin:4px 0!important;}
  #html5-qrcode-button-camera-stop{background:var(--surface2)!important;color:var(--ink2)!important;border:1px solid var(--border2)!important;}
  #html5-qrcode-button-file-selection{display:none!important;}

  .scanner-stopped{display:none;width:100%;aspect-ratio:4/3;background:#0a0c12;border-radius:6px;margin-bottom:12px;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink3);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;border:1px solid var(--border);}
  .scanner-stopped.active{display:flex;}
  .scanner-stopped .check{font-size:32px;color:var(--gold);}

  .scanner-status{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em;margin-bottom:14px;min-height:18px;}
  .scanner-status.found{color:var(--gold);}
  .scanner-status.error{color:var(--red);}

  /* ── 書誌プレビュー ── */
  .book-preview{display:none;align-items:center;gap:16px;padding:16px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;margin-bottom:16px;}
  .book-preview.active{display:flex;}
  .preview-cover{width:52px;height:72px;border-radius:2px;border:1px solid var(--border2);flex-shrink:0;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;box-shadow:3px 3px 10px rgba(0,0,0,.4);}
  .preview-cover img,.preview-cover svg{width:100%;height:100%;object-fit:cover;}
  .preview-cover-hint{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:2px;}
  .preview-cover:hover .preview-cover-hint{opacity:1;}
  .preview-cover-hint span{font-size:16px;}
  .preview-info{flex:1;min-width:0;}
  .preview-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:4px;color:var(--ink);}
  .preview-author{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);margin-bottom:3px;}
  .preview-isbn{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);letter-spacing:.04em;}

  /* ── ルックアップ中 ── */
  .lookup-state{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em;}
  .lookup-state.active{display:flex;}
  .spinner{width:14px;height:14px;border:1.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}

  /* ── 写真撮影 ── */
  .photo-capture-area{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .photo-capture-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border:1px dashed rgba(201,168,76,.2);border-radius:3px;background:transparent;font-family:'DM Mono',monospace;font-size:11px;color:rgba(201,168,76,.4);letter-spacing:.1em;cursor:pointer;transition:all .18s;width:100%;}
  .photo-capture-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.04);}
  .photo-preview-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:200px;border-radius:4px;overflow:hidden;border:1px solid var(--border2);display:none;}
  .photo-preview-wrap.active{display:block;}
  .photo-preview-img{width:100%;height:100%;object-fit:cover;}
  .photo-clear-btn{position:absolute;top:6px;right:6px;padding:4px 10px;background:rgba(0,0,0,.7);color:var(--ink2);border:none;border-radius:2px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.06em;}
  .photo-uploading{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
  .photo-uploading.active{display:flex;}
  .photo-uploading span{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink2);letter-spacing:.08em;}
  #photo-file-input{display:none;}

  .divider-text{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;}
  .divider-text::before,.divider-text::after{content:'';flex:1;border-top:1px solid var(--border);}

  .manual-input-area{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .field-group{display:flex;flex-direction:column;gap:6px;}
  .field-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);}
  .field-input{width:100%;padding:10px 14px;border:1px solid var(--border2);border-radius:2px;font-family:'Noto Serif JP',serif;font-size:14px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s;}
  .field-input:focus{border-color:var(--gold);}
  .field-input::placeholder{color:var(--ink3);}

  .rescan-btn{display:none;width:100%;padding:11px 0;border:1px dashed rgba(201,168,76,.2);border-radius:3px;background:transparent;font-family:'DM Mono',monospace;font-size:11px;color:rgba(201,168,76,.4);letter-spacing:.1em;cursor:pointer;margin-bottom:14px;transition:all .18s;}
  .rescan-btn.active{display:block;}
  .rescan-btn:hover{border-color:var(--gold);color:var(--gold);}

  /* ── 管理画面 ── */
  .mgmt-section{margin-bottom:32px;}
  .mgmt-section-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;margin-bottom:16px;color:var(--gold2);letter-spacing:.05em;}
  .owner-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:8px;}
  .owner-row-emoji{font-size:20px;}
  .owner-row-name{flex:1;font-size:15px;font-weight:600;color:var(--ink);}
  .owner-row-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);margin-right:4px;}
  .owner-row-del{padding:5px 12px;border:1px solid rgba(192,82,74,.2);border-radius:2px;background:none;color:rgba(192,82,74,.5);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .15s;}
  .owner-row-del:hover{background:rgba(192,82,74,.08);color:var(--red);}
  .owner-row-del:disabled{opacity:.25;cursor:not-allowed;}
  .add-owner-form{display:flex;gap:10px;margin-top:14px;}
  .add-owner-input{flex:1;padding:10px 14px;border:1px solid var(--border2);border-radius:2px;font-family:'Noto Serif JP',serif;font-size:14px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s;}
  .add-owner-input:focus{border-color:var(--gold);}
  .add-owner-input::placeholder{color:var(--ink3);}
  .add-owner-btn{padding:10px 18px;border:none;border-radius:2px;background:var(--gold);color:#0f1117;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
  .add-owner-btn:hover{background:var(--gold2);}

  /* ── 星評価 ── */
  .detail-stars{text-align:center;margin-bottom:10px;font-size:18px;letter-spacing:4px;color:var(--gold);}
  .mgmt-star-row{display:flex;gap:2px;align-items:center;flex-shrink:0;}
  .mgmt-star-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:2px 3px;color:var(--border2);transition:color .15s;line-height:1;}
  .mgmt-star-btn.active{color:var(--gold);}
  .mgmt-star-btn:hover{color:var(--gold2);}
  .mgmt-nostar-btn{font-size:14px;padding:2px 5px;border:1px solid var(--border);border-radius:2px;color:var(--ink3);}
  .mgmt-nostar-btn.active{border-color:var(--gold);color:var(--gold);}
  /* 登録モーダル星評価 */
  .reg-star-group{display:flex;gap:6px;margin-top:4px;}
  .reg-star-btn{background:none;border:1px solid var(--border);border-radius:2px;cursor:pointer;font-size:18px;padding:3px 8px;color:var(--border2);transition:color .15s,border-color .15s;line-height:1;}
  .reg-star-btn.active{color:var(--gold);border-color:var(--gold);}
  .reg-star-btn:hover{color:var(--gold2);border-color:var(--gold2);}
  .reg-nostar-btn{font-size:13px;padding:3px 10px;color:var(--ink3);}
  .reg-nostar-btn.active{border-color:var(--gold);color:var(--gold);}
  .mgmt-nostar-btn:hover{border-color:var(--gold2);color:var(--gold2);}

  /* ── 蔵書の見どころ編集 ── */
  .mgmt-book-row{background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:8px;overflow:hidden;}
  .mgmt-book-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;}
  .mgmt-book-thumb{width:28px;height:40px;border-radius:2px;border:1px solid var(--border2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--surface2);}
  .mgmt-book-thumb img,.mgmt-book-thumb svg{width:100%;height:100%;object-fit:cover;}
  .mgmt-book-meta{flex:1;min-width:0;}
  .mgmt-book-title{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mgmt-book-owner{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);margin-top:2px;}
  .mgmt-book-rec-preview{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mgmt-book-edit-btn{padding:5px 10px;border:1px solid var(--border2);border-radius:2px;background:none;color:var(--ink3);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .mgmt-book-edit-btn:hover,.mgmt-book-edit-btn.active{border-color:var(--gold);color:var(--gold);}
  .mgmt-book-rec-form{padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .mgmt-book-rec-form.hidden{display:none;}
  .mgmt-edit-top{display:flex;gap:12px;align-items:flex-start;}
  .mgmt-edit-cover-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
  .mgmt-edit-cover{width:48px;height:66px;border-radius:2px;border:1px solid var(--border2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface2);}
  .mgmt-edit-cover img,.mgmt-edit-cover svg{width:100%;height:100%;object-fit:cover;}
  .mgmt-photo-btn{padding:4px 8px;border:1px dashed rgba(201,168,76,.3);border-radius:2px;background:none;color:rgba(201,168,76,.5);font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;transition:all .15s;letter-spacing:.06em;white-space:nowrap;}
  .mgmt-photo-btn:hover{border-color:var(--gold);color:var(--gold);}
  .mgmt-restore-btn{padding:8px 18px;border:1px solid rgba(201,168,76,.35);border-radius:2px;background:none;color:var(--gold);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.1em;transition:all .18s;}
  .mgmt-restore-btn:hover{background:rgba(201,168,76,.08);border-color:var(--gold2);}
  .mgmt-edit-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
  .mgmt-field-input{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:2px;font-family:'Noto Serif JP',serif;font-size:12px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s;}
  .mgmt-field-input:focus{border-color:var(--gold);}
  .mgmt-field-input::placeholder{color:var(--ink3);}
  .mgmt-field-textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:2px;font-family:'Noto Serif JP',serif;font-size:12px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s;resize:vertical;line-height:1.7;}
  .mgmt-field-textarea:focus{border-color:var(--gold);}
  .mgmt-field-textarea::placeholder{color:var(--ink3);}
  .mgmt-book-rec-save{padding:8px 20px;border:none;border-radius:2px;background:var(--gold);color:#0f1117;font-family:'Noto Serif JP',serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;align-self:flex-end;}
  .mgmt-book-rec-save:hover{background:var(--gold2);}
  .mgmt-uploading{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);letter-spacing:.06em;text-align:center;}

  /* ── 蔵書編集・所有者グループ ── */
  .mgmt-owner-group{margin-bottom:10px;}
  .mgmt-owner-toggle{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:3px;cursor:pointer;user-select:none;transition:border-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .mgmt-owner-toggle:hover,.mgmt-owner-toggle.open{border-color:var(--gold);}
  .mgmt-owner-toggle.open{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .mgmt-owner-toggle-arrow{font-size:13px;color:var(--gold);transition:transform .2s;}
  .mgmt-owner-toggle.open .mgmt-owner-toggle-arrow{transform:rotate(90deg);}
  .mgmt-owner-books{display:none;border:1px solid var(--border2);border-top:none;border-radius:0 0 3px 3px;overflow:hidden;}
  .mgmt-owner-books.open{display:block;}
  .mgmt-owner-books .mgmt-book-row{margin-bottom:0;border-radius:0;border-left:none;border-right:none;border-bottom:1px solid var(--border);}
  .mgmt-owner-books .mgmt-book-row:last-child{border-bottom:none;}

  /* ── 確認ダイアログ ── */
  .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;}
  .confirm-overlay.hidden{display:none!important;}
  .confirm-box{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:30px 26px;max-width:360px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.5);animation:fadeIn .18s ease;}
  .confirm-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;margin-bottom:10px;color:var(--ink);}
  .confirm-body{font-size:13px;color:var(--ink3);line-height:1.8;margin-bottom:26px;}
  .confirm-btns{display:flex;gap:10px;}

  /* ── 操作結果ポップアップ ── */
  .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayIn .18s ease;}
  .result-overlay.hidden{display:none!important;}
  .result-box{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:36px 28px;max-width:300px;width:100%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.5);animation:fadeIn .2s ease;}
  .result-icon{font-size:40px;margin-bottom:16px;line-height:1;}
  .result-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:8px;color:var(--gold2);}
  .result-body{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em;line-height:1.8;margin-bottom:26px;white-space:pre-line;}
  .result-btn{width:100%;padding:13px 0;border:none;border-radius:2px;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .16s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .confirm-btns button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .result-btn.ok{background:var(--gold);color:#0f1117;}
  .result-btn.ok:hover{background:var(--gold2);}
  .result-btn.warn{background:transparent;color:var(--ink2);border:1px solid var(--border2);}
  .result-btn.warn:hover{border-color:var(--ink2);}

  /* ════ ① トップヒーローアクション ════ */
  .hero-btn{
    display:flex;align-items:center;justify-content:center;gap:14px;
    width:100%;padding:22px 0;background:var(--surface);
    border:1px solid var(--border2);border-radius:4px;cursor:pointer;
    font-family:'Noto Serif JP',serif;font-size:16px;font-weight:600;
    color:var(--ink);transition:all .2s;letter-spacing:.06em;
    margin-bottom:28px;
  }
  .hero-btn:hover{border-color:var(--gold);background:var(--surface2);color:var(--gold2);}
  .hero-btn-icon{font-size:28px;line-height:1;}

  /* ════ ③ ランキングセクション ════ */
  .ranking-list{margin-bottom:28px;}
  .rank-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:3px;
    margin-bottom:6px;cursor:pointer;transition:all .2s;
  }
  .rank-item:hover{border-color:var(--gold);background:var(--surface2);}
  .rank-medal{font-size:18px;width:26px;text-align:center;flex-shrink:0;font-family:'DM Mono',monospace;color:var(--ink3);}
  .rank-thumb{
    width:34px;height:48px;border-radius:2px;border:1px solid var(--border2);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;background:var(--surface2);
  }
  .rank-thumb img,.rank-thumb svg{width:100%;height:100%;object-fit:cover;}
  .rank-info{flex:1;min-width:0;}
  .rank-title{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;margin-bottom:2px;}
  .rank-title .title-text{display:inline-block;white-space:nowrap;transform:translateZ(0);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  .rank-author{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ════ ⑤ 週間ピックアップセクション ════ */
  .weekly-pick-card{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:3px;
    margin-bottom:28px;cursor:pointer;transition:all .2s;
  }
  .weekly-pick-card:hover{border-color:var(--gold);background:var(--surface2);}
  .weekly-loading{display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em;}
  .weekly-pick-content{display:contents;}
  .weekly-cover{
    width:34px;height:48px;border-radius:2px;border:1px solid var(--border2);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;background:var(--surface2);
  }
  .weekly-cover img,.weekly-cover svg{width:100%;height:100%;object-fit:cover;}
  .weekly-info{flex:1;min-width:0;}
  .weekly-title{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;margin-bottom:2px;}
  .weekly-title .title-text{display:inline-block;white-space:nowrap;transform:translateZ(0);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  .weekly-author{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
  .weekly-summary{font-size:11px;color:var(--ink3);line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  /* ════ ① おすすめポイント表示 ════ */
  .detail-rec-box{
    background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);
    border-radius:3px;padding:12px 14px;margin-bottom:14px;
  }
  .detail-rec-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .detail-rec-text{font-size:13px;color:var(--ink2);line-height:1.75;}

  /* ════ ④ 感想表示 ════ */
  .detail-reviews{margin-bottom:14px;}
  .detail-reviews-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}
  .review-item{padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;}
  .review-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .review-borrower{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);}
  .review-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);opacity:.6;}
  .review-text{font-size:12px;color:var(--ink2);line-height:1.75;}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-title">図書貸出</div>
  <div class="loading-sub">Loading library…</div>
</div>

<div class="app-wrap">
  <header class="header">
    <div class="header-left">
      <div class="header-title">図書貸出</div>
      <div class="header-sub">Book Lending System</div>
    </div>
    <div class="header-right">
      <button class="sync-btn" id="sync-btn" onclick="syncAll()">↑↓ 同期</button>
      <button class="header-mgmt" onclick="openMgmt()">⚙ 管理</button>
    </div>
  </header>
  <div class="breadcrumb" id="breadcrumb"></div>

  <!-- ════ 画面0: ホーム ════ -->
  <div id="screen-home" class="screen">
    <!-- ⑤ メインアクションボタン（1つ） -->
    <button class="hero-btn" onclick="goToOwners()">
      <span class="hero-btn-icon">📚</span>
      <span>図書を借りる・返却する</span>
    </button>
    <!-- ③ 今月のランキング -->
    <div id="ranking-section"></div>
    <!-- ⑤ 今週の一押し -->
    <div id="weekly-pick-section"></div>
  </div>

  <!-- ════ 画面1: 持ち主一覧 ════ -->
  <div id="screen-owners" class="screen hidden">
    <div class="section-label">持ち主を選択</div>
    <div id="owner-list"></div>
    <button class="btn-back" onclick="backToHome()">← ホーム</button>
  </div>

  <div id="screen-books" class="screen hidden">
    <div class="section-label" id="books-label-wrap">蔵書一覧</div>
    <div id="book-list"></div>
    <button class="add-book-bar" onclick="openRegisterModal()">
      <span style="font-size:15px">📷</span>
      <span>バーコードをスキャンして登録</span>
    </button>
    <button class="btn-back" onclick="backToOwners()">← 持ち主一覧</button>
  </div>
  <div id="screen-detail" class="screen hidden">
    <div class="detail-card" id="detail-card"></div>
    <button class="btn-back" onclick="backToBooks()">← 本の一覧</button>
  </div>
  <div id="screen-mgmt" class="screen hidden">
    <div class="mgmt-section">
      <div class="mgmt-section-title">所有者の管理</div>
      <div id="mgmt-owner-list"></div>
      <div class="add-owner-form">
        <input class="add-owner-input" id="new-owner-input" type="text" placeholder="新しい所有者名…" maxlength="20">
        <button class="add-owner-btn" onclick="addOwner()">追加</button>
      </div>
    </div>
    <div class="mgmt-section">
      <div class="mgmt-section-title">蔵書の編集</div>
      <div id="mgmt-book-list"></div>
    </div>
    <div class="mgmt-section">
      <div class="mgmt-section-title">データのバックアップ・復元</div>
      <div id="mgmt-backup-info" style="font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:12px;"></div>
      <button class="mgmt-restore-btn" onclick="restoreFromBackup()">⬆ バックアップから復元</button>
    </div>
    <button class="btn-back" onclick="backToOwners()">← 持ち主一覧</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 本登録モーダル -->
<div class="modal-overlay hidden" id="register-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">本を登録</div>
    <div class="modal-sub" id="modal-sub">バーコード（ISBN）をカメラに向けてください</div>
    <div>
      <div id="qr-reader"></div>
      <div class="scanner-stopped" id="scanner-stopped">
        <span class="check">✦</span>
        <span id="scanner-stopped-msg">スキャン完了</span>
      </div>
    </div>
    <div class="scanner-status" id="scanner-status"></div>
    <button class="rescan-btn" id="rescan-btn" onclick="restartScanner()">↺ 別の本をスキャン</button>
    <div class="lookup-state" id="lookup-state">
      <div class="spinner"></div>
      <span id="lookup-msg">書誌情報を取得中…</span>
    </div>
    <div class="book-preview" id="book-preview">
      <div class="preview-cover" id="preview-cover" onclick="document.getElementById('photo-file-input').click()">
        <div class="preview-cover-hint"><span>📷</span></div>
      </div>
      <div class="preview-info">
        <div class="preview-title"  id="preview-title"></div>
        <div class="preview-author" id="preview-author"></div>
        <div class="preview-isbn"   id="preview-isbn"></div>
      </div>
    </div>
    <div class="photo-capture-area" id="photo-capture-area">
      <button class="photo-capture-btn" onclick="document.getElementById('photo-file-input').click()">
        <span style="font-size:14px">📷</span>
        <span>表紙を写真で撮影（任意）</span>
      </button>
      <div class="photo-preview-wrap" id="photo-preview-wrap">
        <img class="photo-preview-img" id="photo-preview-img" alt="表紙写真">
        <button class="photo-clear-btn" onclick="clearPhoto()">✕ 削除</button>
        <div class="photo-uploading" id="photo-uploading">
          <div class="spinner"></div>
          <span>Driveにアップロード中…</span>
        </div>
      </div>
    </div>
    <input type="file" id="photo-file-input" accept="image/*" capture="environment" onchange="onPhotoSelected(event)">
    <input type="file" id="mgmt-photo-input" accept="image/*" capture="environment" style="display:none" onchange="onMgmtPhotoSelected(event)">
    <div class="divider-text">または手動入力</div>
    <div class="manual-input-area">
      <div class="field-group">
        <div class="field-label">タイトル</div>
        <input class="field-input" id="manual-title" type="text" placeholder="書名を入力…">
      </div>
      <div class="field-group">
        <div class="field-label">著者</div>
        <input class="field-input" id="manual-author" type="text" placeholder="著者名を入力…">
      </div>
      <div class="field-group">
        <div class="field-label">✦ おすすめポイント（任意）</div>
        <textarea class="field-input" id="reg-recommendation" rows="2" placeholder="この本の見どころを一言…" maxlength="200" style="resize:vertical;min-height:56px"></textarea>
      </div>
      <div class="field-group">
        <div class="field-label">★ おすすめ度（任意）</div>
        <div class="reg-star-group">
          <button class="reg-star-btn reg-nostar-btn active" data-stars="0" onclick="setRegStars(0)">無印</button>
          <button class="reg-star-btn" data-stars="1" onclick="setRegStars(1)">★</button>
          <button class="reg-star-btn" data-stars="2" onclick="setRegStars(2)">★★</button>
          <button class="reg-star-btn" data-stars="3" onclick="setRegStars(3)">★★★</button>
        </div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="closeRegisterModal()">キャンセル</button>
      <button class="btn btn-primary" id="register-confirm-btn" onclick="confirmRegister()" disabled>登録する</button>
    </div>
  </div>
</div>

<!-- 削除確認 -->
<div class="confirm-overlay hidden" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-body"  id="confirm-body"></div>
    <div class="confirm-btns">
      <button class="btn btn-secondary" style="flex:1" onclick="closeConfirm()">キャンセル</button>
      <button class="btn btn-danger"    style="flex:1" id="confirm-ok-btn">削除する</button>
    </div>
  </div>
</div>

<!-- 操作結果ポップアップ -->
<div class="result-overlay hidden" id="result-overlay">
  <div class="result-box">
    <div class="result-icon"  id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-body"  id="result-body"></div>
    <button class="result-btn" id="result-btn" onclick="closeResult()"></button>
  </div>
</div>

<script>
/* ════ GAS API ════ */
const GAS_URL="https://script.google.com/macros/s/AKfycbyamOSmlbHAaNafZk0JU33nww2U24a0a9R_wqc3zFGv1IK-WiDYmToDLvcZEGUFLB3JlQ/exec";
async function gasGet(){const res=await fetch(GAS_URL+"?action=getAll");return res.json();}
async function gasPost(body){const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(body)});return res.json();}
async function uploadImageToDrive(dataUrl,fileName){
  const result=await gasPost({action:"uploadImage",imageData:dataUrl,fileName:fileName});
  if(result.error)throw new Error(result.error);
  return result.url;
}

/* ════ ② 日時ユーティリティ（分単位管理） ════ */
function nowDatetime(){
  const n=new Date();
  const p=x=>String(x).padStart(2,"0");
  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}T${p(n.getHours())}:${p(n.getMinutes())}`;
}
function formatDatetime(dt){
  // 内部は分単位で保持・計算、画面表示は日単位（YYYY-MM-DD）
  if(!dt)return"";
  return dt.includes("T")?dt.split("T")[0]:dt;
}

/* ════ loansからrecommendation/reviewsを再構築（GASがこれらのフィールドを保存しないため） ════ */
function reconstructBookExtras(){
  books.forEach(b=>{
    // ① 最新のおすすめポイントを貸出・登録記録から復元（loanDate空の登録記録も含む）
    const loanRecs=loans
      .filter(l=>String(l.bookId)===String(b.id)&&String(l.recommendation||"").trim())
      .sort((a,z)=>new Date(z.registeredAt||z.loanDate||0)-new Date(a.registeredAt||a.loanDate||0));
    if(loanRecs.length>0){
      b.recommendation=loanRecs[0].recommendation;
    } else if(!b.recommendation){
      b.recommendation="";
    }
    // ④ 感想を返却記録から復元（重複排除）
    if(!Array.isArray(b.reviews))b.reviews=[];
    const returnRecs=loans
      .filter(l=>String(l.bookId)===String(b.id)&&l.returnDate&&!l.loanDate&&String(l.review||"").trim())
      .sort((a,z)=>new Date(a.returnDate)-new Date(z.returnDate));
    returnRecs.forEach(ret=>{
      const dup=b.reviews.some(r=>r.borrower===ret.borrower&&r.date===ret.returnDate);
      if(!dup)b.reviews.push({borrower:ret.borrower||"",text:ret.review,date:ret.returnDate});
    });
    // 星評価をloans記録から復元
    const starRecs=loans
      .filter(l=>String(l.bookId)===String(b.id)&&l.stars!==undefined&&l.stars!=="")
      .sort((a,z)=>new Date(z.registeredAt||z.loanDate||0)-new Date(a.registeredAt||a.loanDate||0));
    if(starRecs.length>0){b.stars=Number(starRecs[0].stars);}
    else if(!b.stars){b.stars=0;}
  });
}

/* ════ 重複排除（同じIDは後勝ち） ════ */
function deduplicateById(arr){
  const map=new Map();
  arr.forEach(b=>map.set(String(b.id),b));
  return [...map.values()];
}

/* ════ GAS取得冊数（saveAllの安全ガード用） ════ */
let gasLoadedBookCount=0;

/* ════ GASデータをバックアップ保存 ════ */
function saveGasBackup(booksArr){
  try{
    localStorage.setItem("lending_books_gas_backup",JSON.stringify(booksArr));
    localStorage.setItem("lending_books_gas_backup_time",new Date().toLocaleString("ja-JP"));
    localStorage.setItem("lending_books_gas_backup_count",String(booksArr.length));
  }catch(e){}
}

/* ════ 起動 ════ */
async function init(){
  try{
    const data=await gasGet();
    owners=data.owners&&data.owners.length?data.owners:defaultOwners;
    // IDが被らないようにindexを加算して生成
    const rawBooks=data.books&&data.books.length
      ?data.books.map((b,i)=>({recommendation:"",reviews:[],stars:0,...b,id:Number(b.id)||(Date.now()+i)}))
      :defaultBooks;
    loans=data.loans&&data.loans.length?data.loans:[];
    // GAS取得成功時のみバックアップを保存（dedup前の生データ）
    saveGasBackup(rawBooks);
    books=deduplicateById(rawBooks);
    gasLoadedBookCount=books.length;
  }catch(e){
    owners=JSON.parse(localStorage.getItem("lending_owners")||"null")||defaultOwners;
    books=JSON.parse(localStorage.getItem("lending_books")||"null")||defaultBooks;
    loans=JSON.parse(localStorage.getItem("lending_loans")||"null")||[];
    gasLoadedBookCount=books.length;
    showToast("オフラインモード：ローカルデータを使用中");
  }
  books=books.map(b=>({recommendation:"",reviews:[],...b}));
  // loansからrecommendation/reviewsを復元（GASが保存しないフィールドを補完）
  reconstructBookExtras();
  localStorage.setItem("lending_owners",JSON.stringify(owners));
  localStorage.setItem("lending_books",JSON.stringify(books));
  localStorage.setItem("lending_loans",JSON.stringify(loans));
  document.getElementById("loading-screen").classList.add("hidden");
  renderHome();
  history.replaceState({screen:"screen-home",owner:"",bookId:null},"","#screen-home");
}

async function saveAll(){
  localStorage.setItem("lending_owners",JSON.stringify(owners));
  localStorage.setItem("lending_books",JSON.stringify(books));
  // 安全ガード：GAS取得時より2冊以上減っている場合はGASへの上書きを中断
  if(gasLoadedBookCount>0 && books.length < gasLoadedBookCount-1){
    showToast(`⚠ 安全のためGAS保存を中断しました（GAS:${gasLoadedBookCount}冊 → ローカル:${books.length}冊）`);
    return;
  }
  try{
    await gasPost({action:"saveOwners",owners});
    await gasPost({action:"saveBooks",books});
  }catch(e){showToast("⚠ オフライン：ローカルに保存しました");}
}

async function syncAll(){
  const btn=document.getElementById("sync-btn");
  btn.classList.add("syncing");btn.textContent="同期中…";
  try{
    const data=await gasGet();
    if(data.owners&&data.owners.length)owners=data.owners;
    if(data.books&&data.books.length){
      const rawBooks=data.books.map((b,i)=>({recommendation:"",reviews:[],...b,id:Number(b.id)||(Date.now()+i)}));
      saveGasBackup(rawBooks);
      books=deduplicateById(rawBooks);
      gasLoadedBookCount=books.length;
    }
    if(data.loans&&data.loans.length)loans=data.loans;
    // loansからrecommendation/reviewsを復元
    reconstructBookExtras();
    localStorage.setItem("lending_owners",JSON.stringify(owners));
    localStorage.setItem("lending_books",JSON.stringify(books));
    localStorage.setItem("lending_loans",JSON.stringify(loans));
    // 現在表示中の画面を再描画
    const cur=getCurrentScreen();
    if(cur==="screen-home")renderHome();
    else if(cur==="screen-owners")renderOwners();
    else if(cur==="screen-detail"){renderDetail();renderBooks();}
    else renderOwners();
    showToast("同期しました");
  }catch(e){showToast("同期失敗：ネットワークを確認してください");}
  btn.classList.remove("syncing");btn.textContent="↑↓ 同期";
}

/* ════ SVGカバー生成 ════ */
async function generateCoverSVG(title,author){
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-iab":"true"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:`本の表紙デザインをSVGで生成してください。書名：${title}　著者：${author||"不明"}。条件：viewBox="0 0 200 280"のSVG、書名の雰囲気に合った配色（2〜3色）、幾何学的パターンで装飾、書名テキストを中央に配置（日本語対応）、著者名を下部に小さく配置、シンプルで美しいデザイン。SVGタグのみ返してください。説明文不要。`}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(c=>c.type==="text")?.text||"";
    const match=text.match(/<svg[\s\S]*<\/svg>/i);
    if(match)return match[0];
  }catch(e){}
  return null;
}

/* ════ coverImage表示ヘルパー ════ */
function coverInnerHtml(b){
  if(!b.coverImage)return`<span>${b.emoji||"📖"}</span>`;
  const ci=b.coverImage.trimStart();
  // SVG → base64のdata URLとして<img>表示
  // （直接innerHTML展開するとSVG内テキストがDOMに漏れ出て見えてしまうため）
  if(ci.startsWith("<svg")){
    try{
      const b64=btoa(unescape(encodeURIComponent(ci)));
      return`<img src="data:image/svg+xml;base64,${b64}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<span>📖</span>'">`;
    }catch(e){return`<span>${b.emoji||"📖"}</span>`;}
  }
  // Drive UC形式URL → thumbnailエンドポイントに変換（直リンクがブロックされるケース対策）
  let src=b.coverImage;
  const m=src.match(/[?&]id=([\w-]+)/);
  if(m)src=`https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
  return`<img src="${src}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<span>📖</span>'">`;
}
function thumbHtml(b){
  return`<div class="book-thumb">${coverInnerHtml(b)}</div>`;
}

/* ════ ③ 貸出回数ランキング計算 ════ */
function computeRanking(){
  // 貸出記録：loanDate が存在する行
  const loanRecs=loans.filter(l=>l.loanDate&&String(l.loanDate).trim());
  // 返却記録：returnDate が存在し loanDate が空の行
  const returnRecs=loans.filter(l=>l.returnDate&&String(l.returnDate).trim()&&(!l.loanDate||!String(l.loanDate).trim()));
  const counts={};
  const usedSet=new Set();

  returnRecs.forEach(ret=>{
    const retTime=new Date(ret.returnDate).getTime();
    if(isNaN(retTime))return;
    let bestIdx=-1,bestTime=-Infinity;
    loanRecs.forEach((ln,idx)=>{
      if(usedSet.has(idx))return;
      if(String(ln.bookId)!==String(ret.bookId))return;
      if(ln.borrower!==ret.borrower)return;
      const lnTime=new Date(ln.loanDate).getTime();
      if(isNaN(lnTime))return;
      if(lnTime<=retTime&&lnTime>bestTime){bestTime=lnTime;bestIdx=idx;}
    });
    if(bestIdx>=0){
      usedSet.add(bestIdx);
      const durationMin=(retTime-bestTime)/60000;
      if(durationMin>=10){
        counts[ret.bookId]=(counts[ret.bookId]||0)+1;
      }
    }
  });

  return Object.entries(counts)
    .map(([bookId,count])=>({bookId:Number(bookId),count}))
    .sort((a,b)=>b.count-a.count);
}

function renderRankingSection(ranking){
  const sec=document.getElementById("ranking-section");
  if(!ranking.length){sec.innerHTML="";return;}
  const total=ranking.reduce((s,r)=>s+r.count,0);
  let showCount=1;
  if(total>=100)showCount=5;
  else if(total>=21)showCount=3;
  const items=ranking.slice(0,showCount);
  const month=new Date().getMonth()+1;
  const medals=["🥇","🥈","🥉"];
  let html=`<div class="section-label">${month}月のトップ貸し出し図書</div><div class="ranking-list">`;
  items.forEach((item,i)=>{
    const book=books.find(b=>b.id==item.bookId);
    if(!book)return;
    const medal=i<3?medals[i]:`${i+1}`;
    html+=`<div class="rank-item" onclick="selectBookFromRanking(${book.id})">
      <div class="rank-medal">${medal}</div>
      <div class="rank-thumb">${coverInnerHtml(book)}</div>
      <div class="rank-info">
        <div class="rank-title"><span class="title-text">${book.title}</span></div>
        <div class="rank-author">${book.author||""}</div>
      </div>
    </div>`;
  });
  html+="</div>";
  sec.innerHTML=html;
  requestAnimationFrame(applyMarquee);
}

async function renderWeeklyPick(){
  const sec=document.getElementById("weekly-pick-section");
  if(!books.length){sec.innerHTML="";return;}

  // おすすめ・感想あり優先、なければ全蔵書からランダム選出
  // 貸出中は除外
  const available=books.filter(b=>b.status!=="borrowed");
  if(!available.length){sec.innerHTML="";return;}
  const withData=available.filter(b=>
    (b.recommendation&&b.recommendation.trim())||
    (b.reviews&&b.reviews.length>0)
  );
  const pool=withData.length?withData:available;
  const pick=pool[Math.floor(Math.random()*pool.length)];

  sec.innerHTML=`<div class="section-label">今週のピックアップ</div>
    <div class="weekly-pick-card" id="weekly-pick-inner">
      <div class="weekly-loading"><div class="spinner"></div><span>情報を生成中…</span></div>
    </div>`;

  // AI要約用のソーステキスト構築
  const hasExtra=(pick.recommendation&&pick.recommendation.trim())||
                 (pick.reviews&&pick.reviews.length>0);
  let sourceText=`書名：${pick.title}`;
  if(pick.author)sourceText+=`　著者：${pick.author}`;
  if(pick.recommendation&&pick.recommendation.trim())sourceText+=`\nおすすめポイント：${pick.recommendation}`;
  if(pick.reviews&&pick.reviews.length){
    pick.reviews.slice(-3).forEach(r=>{sourceText+=`\n感想（${r.borrower}）：${r.text}`;});
  }

  let summary="";

  // おすすめ・感想データがある場合のみAI要約を試みる
  if(hasExtra&&GEMINI_API_KEY){
    try{
      const res=await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{parts:[{text:
              `以下の図書情報をもとに、50〜80文字の魅力的な紹介文を日本語で書いてください。宣伝用の短い文章で、読みたくなるようなものにしてください。余計な説明は不要です。紹介文のみ返してください。\n\n${sourceText}`
            }]}],
            generationConfig:{maxOutputTokens:200,temperature:0.7}
          })
        }
      );
      const data=await res.json();
      summary=data.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||"";
    }catch(e){}
    // APIが使えない場合はおすすめ文・感想をそのまま表示
    if(!summary){
      summary=pick.recommendation||(pick.reviews&&pick.reviews[0]?.text)||"";
      if(summary.length>100)summary=summary.slice(0,100)+"…";
    }
  } else if(hasExtra&&!GEMINI_API_KEY){
    // APIキー未設定：おすすめ文・感想をそのまま表示
    summary=pick.recommendation||(pick.reviews&&pick.reviews[0]?.text)||"";
    if(summary.length>100)summary=summary.slice(0,100)+"…";
  }

  // おすすめ・感想がない場合はデフォルト紹介文
  if(!summary){
    const defaults=[
      "まだ感想未登録の一冊です。ぜひ手に取って、最初の感想を残してみてください。",
      "蔵書の中から今週のおすすめ。借りた方はぜひおすすめポイントを教えてください。",
      "今週のピックアップ。読んだ感想を登録するとここに表示されます。"
    ];
    summary=defaults[Math.floor(Math.random()*defaults.length)];
  }

  const inner=document.getElementById("weekly-pick-inner");
  if(!inner)return;
  inner.setAttribute("onclick",`selectBookFromRanking(${pick.id})`);
  inner.innerHTML=`<div class="weekly-pick-content">
    <div class="weekly-cover">${coverInnerHtml(pick)}</div>
    <div class="weekly-info">
      <div class="weekly-title"><span class="title-text">${pick.title}</span></div>
      <div class="weekly-author">${pick.author||""}</div>
      ${summary?`<div class="weekly-summary">${summary}</div>`:""}
    </div>
  </div>`;
  requestAnimationFrame(applyMarquee);
}

async function returnBook(){

/* ════ タイトルマーキー（左流れループ・一定速度） ════ */
function applyMarquee(){
  const PX_PER_SEC=50;
  const INIT_DELAY=5000;  // 初回スクロール開始までの待機(ms)
  const PAUSE_AFTER=5000; // スクロール後、先頭に戻ってからの待機(ms)

  const run=()=>{
    document.querySelectorAll('.book-title .title-text,.rank-title .title-text,.weekly-title .title-text').forEach(span=>{
      // 既存のタイマー・アニメーションをキャンセル
      if(span._mTimer){clearTimeout(span._mTimer);span._mTimer=null;}
      if(span._mAnim){try{span._mAnim.cancel();}catch(e){}span._mAnim=null;}
      span.style.transform='';
      const par=span.parentElement;
      par.classList.remove('scrolling');
      if(!document.contains(span))return;
      // テキストの複製は不要（先頭に戻る方式のため）
      const origW=span.scrollWidth;
      const contW=par.clientWidth;
      if(origW<=contW+2)return;
      par.classList.add('scrolling');
      const dist=Math.round(origW); // スクロール距離（テキスト全体が左端から抜けきるまで）
      const dur=dist/PX_PER_SEC*1000;     // 速度一定（ms）
      const scroll=()=>{
        if(!document.contains(span))return;
        // translate3d を使い描画レイヤーを一定に保つ
        const a=span.animate(
          [{transform:'translate3d(0,0,0)'},{transform:'translate3d('+(-dist)+'px,0,0)'}],
          {duration:dur,easing:'linear',fill:'forwards'}
        );
        span._mAnim=a;
        a.addEventListener('finish',()=>{
          // 先頭に戻す
          span.style.transform='translate3d(0,0,0)';
          try{a.cancel();}catch(e){}
          span._mAnim=null;
          // 少し待ってから再スクロール
          span._mTimer=setTimeout(scroll,PAUSE_AFTER);
        },{once:true});
      };
      // 最初は少し遅らせてから開始
      span._mTimer=setTimeout(scroll,INIT_DELAY);
    });
  };

  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(run);
}

let mgmtEditBookId=null,mgmtPendingCover=null;
function openMgmtPhoto(bookId){
  mgmtEditBookId=bookId;mgmtPendingCover=null;

async function onMgmtPhotoSelected(event){
  const file=event.target.files[0];
  if(!file||!mgmtEditBookId)return;
  const bookId=mgmtEditBookId;
  const upEl=document.getElementById(`mgmt-uploading-${bookId}`);
  const covEl=document.getElementById(`mgmt-edit-cover-${bookId}`);
  if(upEl)upEl.classList.remove("hidden");
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const img=new Image();
    img.onload=async()=>{
      const MAX=600,scale=MAX/Math.min(img.width,img.height);
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      const jpeg=canvas.toDataURL("image/jpeg",0.80);
      try{
        const url=await uploadImageToDrive(jpeg,`cover_${bookId}_${Date.now()}.jpg`);
        mgmtPendingCover=url;
        if(covEl)covEl.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
        showToast("表紙写真を更新しました");
      }catch(err){showToast("写真のアップロードに失敗しました");}
      if(upEl)upEl.classList.add("hidden");
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function setStatus(msg,cls){
  const el=document.getElementById("scanner-status");
  el.textContent=msg;el.className="scanner-status"+(cls?" "+cls:"");
}
async function openRegisterModal(){
  resetModal();
  document.getElementById("register-modal").classList.remove("hidden");
  await startScanner();
}
function closeRegisterModal(){
  stopScanner();
  document.getElementById("register-modal").classList.add("hidden");
  const qr=document.getElementById("qr-reader");
  qr.innerHTML="";qr.style.display="block";
  document.getElementById("scanner-stopped").classList.remove("active");
}
async function startScanner(){
  html5QrCode=new Html5Qrcode("qr-reader");
  try{
    await html5QrCode.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:100},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128]},
      onScanSuccess,()=>{}
    );
  }catch(e){setStatus(`カメラを起動できませんでした：${e.message||e}`,"error");}
}
function stopScanner(){
  if(html5QrCode){
    try{html5QrCode.stop().catch(()=>{});html5QrCode.clear();}catch(_){}
    html5QrCode=null;
  }
  scannedIsbn=null;
}
async function restartScanner(){
  pendingBook=null;scannedIsbn=null;capturedPhotoDataUrl=null;
  document.getElementById("book-preview").classList.remove("active");
  document.getElementById("photo-capture-area").classList.remove("active");
  document.getElementById("photo-preview-wrap").classList.remove("active");
  document.getElementById("rescan-btn").classList.remove("active");
  document.getElementById("scanner-stopped").classList.remove("active");
  const qr=document.getElementById("qr-reader");
  qr.innerHTML="";qr.style.display="block";
  document.getElementById("register-confirm-btn").disabled=true;
  document.getElementById("manual-title").value="";
  document.getElementById("manual-author").value="";
  setStatus("","");
  document.getElementById("modal-sub").textContent="バーコード（ISBN）をカメラに向けてください";
  await startScanner();
}
function onScanSuccess(text){
  if(!/^(978|979)\d{10}$/.test(text)&&!/^\d{9}[\dX]$/.test(text))return;
  if(text===scannedIsbn)return;
  scannedIsbn=text;
  html5QrCode.stop().then(()=>{
    html5QrCode.clear();html5QrCode=null;
    document.getElementById("qr-reader").style.display="none";
    document.getElementById("scanner-stopped").classList.add("active");
    document.getElementById("scanner-stopped-msg").textContent=`ISBN: ${text}`;
    fetchBookInfo(text);
  }).catch(()=>{fetchBookInfo(text);});
}

async function fetchBookInfo(isbn){
  setStatus("書誌情報を取得中…","found");
  document.getElementById("lookup-state").classList.add("active");
  document.getElementById("lookup-msg").textContent="書誌情報を取得中…";
  document.getElementById("modal-sub").textContent="書誌情報を取得中…";
  try{
    const ob=await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
    const od=await ob.json();
    const summary=od?.[0]?.summary;
    if(!summary?.title)throw new Error("書誌情報が見つかりませんでした");
    const title=summary.title||"";
    const author=summary.author||"";
    let coverImage=summary.cover||null;
    if(!coverImage){
      document.getElementById("lookup-msg").textContent="表紙画像を生成中…";
      setStatus("表紙画像を生成中…","found");
      const svg=await generateCoverSVG(title,author);
      if(svg)coverImage=svg;
    }
    document.getElementById("lookup-state").classList.remove("active");
    pendingBook={title,author,isbn,coverImage};
    showPreview(pendingBook);
    setStatus(`「${title}」を取得しました ✦`,"found");
    document.getElementById("modal-sub").textContent="内容を確認して登録してください";
    document.getElementById("rescan-btn").classList.add("active");
    syncBtn();
  }catch(e){
    document.getElementById("lookup-state").classList.remove("active");
    setStatus(`取得失敗 — 手動入力してください (${e.message})`,"error");
    document.getElementById("modal-sub").textContent="手動でタイトルを入力してください";
    document.getElementById("rescan-btn").classList.add("active");
    document.getElementById("manual-title").focus();
  }
}

function showPreview(book){
  const cover=document.getElementById("preview-cover");
  let inner="";
  if(book.coverImage){
    if(book.coverImage.trimStart().startsWith("<svg")){inner=book.coverImage;}
    else{inner=`<img src="${book.coverImage}" alt="${book.title}">`;}
  }else{inner="📖";}
  cover.innerHTML=inner+`<div class="preview-cover-hint"><span>📷</span></div>`;
  document.getElementById("preview-title").textContent=book.title;
  document.getElementById("preview-author").textContent=book.author||"";
  document.getElementById("preview-isbn").textContent=`ISBN ${book.isbn}`;
  document.getElementById("book-preview").classList.add("active");
  document.getElementById("manual-title").value=book.title;
  document.getElementById("manual-author").value=book.author||"";
}

async function onPhotoSelected(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const dataUrl=e.target.result;
    const img=new Image();
    img.onload=async()=>{
      const MAX=600;
      const scale=MAX/Math.min(img.width,img.height);
      const w=Math.round(img.width*scale);
      const h=Math.round(img.height*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      capturedPhotoDataUrl=canvas.toDataURL("image/jpeg",0.80);
      document.getElementById("photo-preview-img").src=capturedPhotoDataUrl;
      document.getElementById("photo-preview-wrap").classList.add("active");
      document.getElementById("photo-uploading").classList.add("active");
      document.getElementById("register-confirm-btn").disabled=true;
      try{
        const fileName=`cover_${Date.now()}.jpg`;
        const driveUrl=await uploadImageToDrive(capturedPhotoDataUrl,fileName);
        capturedPhotoDataUrl=driveUrl;
        if(pendingBook){pendingBook.coverImage=driveUrl;showPreview(pendingBook);}
        document.getElementById("photo-uploading").classList.remove("active");
        showToast("表紙写真をアップロードしました");
        syncBtn();
      }catch(err){
        document.getElementById("photo-uploading").classList.remove("active");
        // base64のままローカル保存（Driveアップロード失敗時のフォールバック）
        showToast("Drive未接続：表紙は端末内のみ保存されます");
        syncBtn();
      }
    };
    img.src=dataUrl;
  };
  reader.readAsDataURL(file);
}

function clearPhoto(){
  capturedPhotoDataUrl=null;
  document.getElementById("photo-preview-img").src="";
  document.getElementById("photo-preview-wrap").classList.remove("active");
  document.getElementById("photo-file-input").value="";
  if(pendingBook&&scannedIsbn){fetchBookInfo(scannedIsbn);}
}

async function confirmRegister(){
  const title=document.getElementById("manual-title").value.trim()||pendingBook?.title||"";
  const author=document.getElementById("manual-author").value.trim()||pendingBook?.author||"";
  const isbn=pendingBook?.isbn||"";
  const cover=capturedPhotoDataUrl||pendingBook?.coverImage||null;
  const rec=document.getElementById("reg-recommendation")?.value.trim()||"";
  if(!title)return;
  document.getElementById("register-confirm-btn").disabled=true;
  document.getElementById("register-confirm-btn").textContent="保存中…";
  const newId=Date.now();
  books=deduplicateById([...books,{id:newId,owner:currentOwner,title,author,isbn,coverImage:cover,emoji:"📖",status:"available",borrower:"",recommendation:rec,stars:regStars,reviews:[]}]);
  // 登録時のおすすめポイント・星評価をloansに保存
  const regRecord={bookId:newId,borrower:currentOwner,loanDate:"",returnDate:"",recommendation:rec,stars:regStars,registeredAt:nowDatetime()};
  if(rec||regStars){
    loans.push(regRecord);
    localStorage.setItem("lending_loans",JSON.stringify(loans));
    gasPost({action:"saveLoans",loans:[regRecord]});
  }
  closeRegisterModal();renderBooks();
  showResult("📚","登録しました",`「${title}」を\n${currentOwner} の蔵書に登録しました`);
  saveAll();
}

/* ════ 初期化 ════ */
init();
document.getElementById("new-owner-input").addEventListener("keydown",e=>{if(e.key==="Enter")addOwner();});

/* ════ 戻るボタン対応 ════ */
window.addEventListener("popstate",(e)=>{
  if(!document.getElementById("register-modal").classList.contains("hidden")){
    closeRegisterModal();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  if(!document.getElementById("confirm-overlay").classList.contains("hidden")){
    closeConfirm();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  if(!document.getElementById("result-overlay").classList.contains("hidden")){
    closeResult();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  const state=e.state;
  if(!state){renderHome();return;}
  currentOwner=state.owner||"";
  currentBookId=state.bookId||null;
  switch(state.screen){
    case "screen-home":
      renderHome();break;
    case "screen-owners":
      showScreen("screen-owners",false);renderOwners();break;
    case "screen-books":
      showScreen("screen-books",false);
      document.getElementById("books-label-wrap").textContent=currentOwner+" の蔵書";
      renderBooks();
      updateBreadcrumb([{label:"ホーム",action:"backToHome()"},{label:"持ち主一覧",action:"backToOwners()"},{label:currentOwner}]);
      break;
    case "screen-detail":
      if(!currentBookId){showScreen("screen-books",false);renderBooks();return;}
      showScreen("screen-detail",false);renderDetail();
      const b=books.find(x=>x.id===currentBookId);
      if(b)updateBreadcrumb([
        {label:"ホーム",action:"backToHome()"},
        {label:"持ち主一覧",action:"backToOwners()"},
        {label:currentOwner,action:"backToBooks()"},
        {label:b.title}
      ]);
      break;
    case "screen-mgmt":
      showScreen("screen-mgmt",false);
      updateBreadcrumb([{label:"ホーム",action:"backToHome()"},{label:"持ち主一覧",action:"backToOwners()"},{label:"管理"}]);
      renderMgmt();break;
  }
});
function getCurrentScreen(){
  return["screen-home","screen-owners","screen-books","screen-detail","screen-mgmt"].find(s=>!document.getElementById(s).classList.contains("hidden"))||"screen-home";
}
