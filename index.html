<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図書貸出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--ink:#1a1a18;--paper:#f5f2ec;--cream:#ece8df;--accent:#8b5e3c;--blue:#3c6e8b;--green:#3a6b4a;--red:#8b3a3a;--shadow:rgba(26,26,24,0.08);--border:rgba(26,26,24,0.12);}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Serif JP',serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(26,26,24,.025) 28px,rgba(26,26,24,.025) 29px);pointer-events:none;z-index:0;}
  .app-wrap{max-width:480px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:16px;border-bottom:2px solid var(--ink);}
  .header-left{display:flex;align-items:baseline;gap:12px;}
  .header-title{font-size:26px;font-weight:600;letter-spacing:.05em;line-height:1;}
  .header-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .header-mgmt{padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:rgba(26,26,24,.5);cursor:pointer;background:white;transition:all .16s;}
  .header-mgmt:hover{border-color:var(--accent);color:var(--accent);}
  .sync-btn{padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:rgba(26,26,24,.5);cursor:pointer;background:white;transition:all .16s;}
  .sync-btn:hover{border-color:var(--blue);color:var(--blue);}
  .sync-btn.syncing{color:var(--blue);border-color:var(--blue);}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.45);margin-bottom:20px;letter-spacing:.06em;min-height:18px;}
  .breadcrumb span{cursor:pointer;}
  .breadcrumb span:hover{color:var(--accent);}
  .breadcrumb .sep{opacity:.4;}
  .breadcrumb .current{color:var(--ink);font-weight:500;}
  .section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,26,24,.4);margin-bottom:12px;}
  .owner-card{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:white;border:1px solid var(--border);border-radius:4px;margin-bottom:8px;cursor:pointer;transition:all .18s;box-shadow:0 1px 3px var(--shadow);}
  .owner-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(139,94,60,.12);transform:translateX(3px);}
  .owner-name{font-size:16px;font-weight:600;letter-spacing:.04em;}
  .owner-count{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);}
  .owner-arrow{color:var(--accent);font-size:14px;opacity:.6;margin-left:8px;}
  .book-card{display:flex;align-items:center;gap:14px;padding:12px 16px;background:white;border:1px solid var(--border);border-radius:4px;margin-bottom:8px;cursor:pointer;transition:all .18s;box-shadow:0 1px 3px var(--shadow);}
  .book-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(60,110,139,.1);transform:translateX(3px);}
  .book-thumb{width:44px;height:60px;border-radius:3px;border:1px solid var(--border);flex-shrink:0;background:var(--cream);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:1px 1px 4px rgba(26,26,24,.1);}
  .book-thumb img,.book-thumb svg{width:100%;height:100%;object-fit:cover;}
  .book-info{flex:1;min-width:0;}
  .book-title{font-size:15px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .book-author{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .book-meta{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.35);}
  .badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;flex-shrink:0;}
  .badge.available{background:rgba(58,107,74,.1);color:var(--green);border:1px solid rgba(58,107,74,.2);}
  .badge.borrowed{background:rgba(139,58,58,.08);color:var(--red);border:1px solid rgba(139,58,58,.18);}
  .detail-card{background:white;border:1px solid var(--border);border-radius:4px;padding:28px 24px;box-shadow:0 2px 12px var(--shadow);}
  .detail-cover-wrap{display:flex;justify-content:center;margin-bottom:24px;}
  .detail-cover{width:100px;height:138px;border-radius:4px;border:1px solid var(--border);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:4px 4px 16px rgba(26,26,24,.12),-2px -2px 0 var(--cream);overflow:hidden;}
  .detail-cover img,.detail-cover svg{width:100%;height:100%;object-fit:cover;}
  .detail-title{font-size:20px;font-weight:600;text-align:center;margin-bottom:4px;line-height:1.4;}
  .detail-author{font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.5);text-align:center;margin-bottom:4px;}
  .detail-owner{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.35);text-align:center;margin-bottom:20px;letter-spacing:.06em;}
  .detail-divider{border:none;border-top:1px dashed var(--border);margin:20px 0;}
  .detail-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .detail-label{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);letter-spacing:.08em;text-transform:uppercase;}
  .detail-value{font-weight:600;font-size:14px;}
  .btn-group{display:flex;gap:10px;margin-top:24px;}
  .btn{flex:1;padding:13px 0;border:none;border-radius:3px;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:all .16s;}
  .btn-primary{background:var(--blue);color:white;}
  .btn-primary:hover{background:#2e5a73;}
  .btn-primary:disabled{background:var(--cream);color:rgba(26,26,24,.3);cursor:not-allowed;}
  .btn-secondary{background:var(--cream);color:var(--ink);border:1px solid var(--border);}
  .btn-secondary:hover{background:#e0dbd0;}
  .btn-secondary:disabled{color:rgba(26,26,24,.3);cursor:not-allowed;}
  .btn-danger{background:rgba(139,58,58,.08);color:var(--red);border:1px solid rgba(139,58,58,.2);}
  .btn-danger:hover{background:rgba(139,58,58,.15);}
  .delete-zone{margin-top:40px;padding-top:20px;border-top:1px dashed var(--border);display:flex;justify-content:center;}
  .btn-delete-sm{padding:8px 20px;border:1px solid rgba(139,58,58,.2);border-radius:3px;background:none;color:rgba(139,58,58,.5);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
  .btn-delete-sm:hover{background:rgba(139,58,58,.08);color:var(--red);border-color:rgba(139,58,58,.4);}
  .btn-back{display:inline-flex;align-items:center;gap:6px;margin-top:20px;padding:0;background:none;border:none;font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.45);cursor:pointer;letter-spacing:.06em;transition:color .15s;}
  .btn-back:hover{color:var(--accent);}
  .input-wrap{margin-top:16px;display:none;}
  .input-wrap.visible{display:block;}
  .input-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,26,24,.45);margin-bottom:6px;}
  .input-field{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:3px;font-family:'Noto Serif JP',serif;font-size:14px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s;}
  .input-field:focus{border-color:var(--blue);}
  .empty-state{text-align:center;padding:48px 0;color:rgba(26,26,24,.35);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;line-height:2;}
  .add-book-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:13px 0;border:1.5px dashed var(--border);border-radius:4px;cursor:pointer;color:rgba(26,26,24,.4);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;transition:all .18s;background:transparent;width:100%;}
  .add-book-bar:hover{border-color:var(--blue);color:var(--blue);background:rgba(60,110,139,.04);}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;padding:10px 20px;border-radius:2px;opacity:0;transition:all .3s;white-space:nowrap;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .screen{animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none!important;}
  .loading-screen{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:500;}
  .loading-screen.hidden{display:none!important;}
  .loading-title{font-size:22px;font-weight:600;letter-spacing:.05em;}
  .loading-sub{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);letter-spacing:.1em;}
  .loading-spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-overlay{position:fixed;inset:0;background:rgba(26,26,24,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:overlayIn .2s ease;}
  .modal-overlay.hidden{display:none!important;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal-sheet{background:var(--paper);width:100%;max-width:480px;border-radius:12px 12px 0 0;padding:28px 24px 44px;animation:sheetUp .26s cubic-bezier(.16,1,.3,1);max-height:92vh;overflow-y:auto;}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 24px;}
  .modal-title{font-size:17px;font-weight:600;margin-bottom:4px;letter-spacing:.03em;}
  .modal-sub{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);margin-bottom:20px;letter-spacing:.06em;}
  #qr-reader{width:100%;border-radius:8px;overflow:hidden;margin-bottom:12px;background:#000;}
  #qr-reader__scan_region{border-radius:8px;overflow:hidden;}
  #qr-reader__dashboard{padding:8px 0 0!important;background:transparent!important;border:none!important;}
  #qr-reader__dashboard_section_swaplink{display:none!important;}
  #qr-reader__status_span{font-family:'DM Mono',monospace!important;font-size:11px!important;color:rgba(26,26,24,.5)!important;}
  #qr-reader__camera_selection{width:100%!important;padding:8px 10px!important;border:1px solid var(--border)!important;border-radius:3px!important;font-family:'Noto Serif JP',serif!important;font-size:13px!important;background:white!important;margin-bottom:8px!important;outline:none!important;}
  #qr-reader__camera_permission_button,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{padding:10px 0!important;width:100%!important;border:none!important;border-radius:3px!important;font-family:'Noto Serif JP',serif!important;font-size:14px!important;font-weight:600!important;cursor:pointer!important;background:var(--blue)!important;color:white!important;margin:4px 0!important;}
  #html5-qrcode-button-camera-stop{background:var(--cream)!important;color:var(--ink)!important;border:1px solid var(--border)!important;}
  #html5-qrcode-button-file-selection{display:none!important;}
  .scanner-stopped{display:none;width:100%;aspect-ratio:4/3;background:#111;border-radius:8px;margin-bottom:12px;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(255,255,255,.5);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;}
  .scanner-stopped.active{display:flex;}
  .scanner-status{text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.5);letter-spacing:.06em;margin-bottom:14px;min-height:18px;}
  .scanner-status.found{color:var(--green);font-weight:500;}
  .scanner-status.error{color:var(--red);}
  .book-preview{display:none;align-items:center;gap:16px;padding:16px;background:white;border:1px solid var(--border);border-radius:6px;margin-bottom:16px;box-shadow:0 1px 4px var(--shadow);}
  .book-preview.active{display:flex;}
  .preview-cover{width:56px;height:78px;border-radius:3px;border:1px solid var(--border);flex-shrink:0;overflow:hidden;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative;}
  .preview-cover img,.preview-cover svg{width:100%;height:100%;object-fit:cover;}
  .preview-cover-hint{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:3px;}
  .preview-cover:hover .preview-cover-hint{opacity:1;}
  .preview-cover-hint span{font-size:16px;}
  .preview-info{flex:1;min-width:0;}
  .preview-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px;}
  .preview-author{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.5);margin-bottom:4px;}
  .preview-isbn{font-family:'DM Mono',monospace;font-size:10px;color:rgba(26,26,24,.3);letter-spacing:.04em;}
  .photo-capture-area{display:none;flex-direction:column;gap:8px;margin-bottom:16px;}
  .photo-capture-area.active{display:flex;}
  .photo-capture-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border:1.5px dashed var(--border);border-radius:4px;background:transparent;font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.4);letter-spacing:.1em;cursor:pointer;transition:all .18s;width:100%;}
  .photo-capture-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(60,110,139,.04);}
  .photo-preview-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:200px;border-radius:6px;overflow:hidden;border:1px solid var(--border);display:none;}
  .photo-preview-wrap.active{display:block;}
  .photo-preview-img{width:100%;height:100%;object-fit:cover;}
  .photo-clear-btn{position:absolute;top:6px;right:6px;padding:4px 10px;background:rgba(26,26,24,.7);color:white;border:none;border-radius:2px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.06em;}
  .photo-uploading{position:absolute;inset:0;background:rgba(26,26,24,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-radius:6px;}
  .photo-uploading.active{display:flex;}
  .photo-uploading span{font-family:'DM Mono',monospace;font-size:11px;color:white;letter-spacing:.06em;}
  #photo-file-input{display:none;}
  .lookup-state{display:none;align-items:center;gap:10px;padding:12px 16px;background:white;border:1px solid var(--border);border-radius:4px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.5);letter-spacing:.06em;}
  .lookup-state.active{display:flex;}
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
  .divider-text{display:flex;align-items:center;gap:10px;margin:12px 0 10px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(26,26,24,.3);letter-spacing:.1em;}
  .divider-text::before,.divider-text::after{content:'';flex:1;border-top:1px solid var(--border);}
  .manual-input-area{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .field-group{display:flex;flex-direction:column;gap:5px;}
  .field-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,26,24,.4);}
  .field-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:3px;font-family:'Noto Serif JP',serif;font-size:14px;background:white;color:var(--ink);outline:none;transition:border-color .15s;}
  .field-input:focus{border-color:var(--blue);}
  .rescan-btn{display:none;width:100%;padding:11px 0;border:1.5px dashed var(--border);border-radius:4px;background:transparent;font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.4);letter-spacing:.1em;cursor:pointer;margin-bottom:14px;transition:all .18s;}
  .rescan-btn.active{display:block;}
  .rescan-btn:hover{border-color:var(--blue);color:var(--blue);}
  .mgmt-section{margin-bottom:32px;}
  .mgmt-section-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .owner-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:white;border:1px solid var(--border);border-radius:4px;margin-bottom:8px;box-shadow:0 1px 3px var(--shadow);}
  .owner-row-emoji{font-size:20px;}
  .owner-row-name{flex:1;font-size:15px;font-weight:600;}
  .owner-row-count{font-family:'DM Mono',monospace;font-size:11px;color:rgba(26,26,24,.4);margin-right:4px;}
  .owner-row-del{padding:5px 12px;border:1px solid rgba(139,58,58,.25);border-radius:3px;background:none;color:var(--red);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;}
  .owner-row-del:hover{background:rgba(139,58,58,.08);}
  .owner-row-del:disabled{opacity:.3;cursor:not-allowed;}
  .add-owner-form{display:flex;gap:10px;margin-top:14px;}
  .add-owner-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:3px;font-family:'Noto Serif JP',serif;font-size:14px;background:white;color:var(--ink);outline:none;transition:border-color .15s;}
  .add-owner-input:focus{border-color:var(--blue);}
  .add-owner-btn{padding:10px 18px;border:none;border-radius:3px;background:var(--blue);color:white;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
  .add-owner-btn:hover{background:#2e5a73;}
  .confirm-overlay{position:fixed;inset:0;background:rgba(26,26,24,.6);backdrop-filter:blur(2px);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;}
  .confirm-overlay.hidden{display:none!important;}
  .confirm-box{background:var(--paper);border-radius:8px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(26,26,24,.2);animation:fadeIn .18s ease;}
  .confirm-title{font-size:16px;font-weight:600;margin-bottom:10px;}
  .confirm-body{font-size:14px;color:rgba(26,26,24,.65);line-height:1.7;margin-bottom:24px;}
  .confirm-btns{display:flex;gap:10px;}
  /* ── 操作結果ポップアップ ── */
  .result-overlay{position:fixed;inset:0;background:rgba(26,26,24,.5);backdrop-filter:blur(2px);z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayIn .18s ease;}
  .result-overlay.hidden{display:none!important;}
  .result-box{background:white;border-radius:8px;padding:32px 28px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(26,26,24,.2);animation:fadeIn .2s ease;}
  .result-icon{font-size:40px;margin-bottom:16px;line-height:1;}
  .result-title{font-size:17px;font-weight:600;margin-bottom:8px;letter-spacing:.03em;}
  .result-body{font-family:'DM Mono',monospace;font-size:12px;color:rgba(26,26,24,.5);letter-spacing:.06em;line-height:1.7;margin-bottom:24px;white-space:pre-line;}
  .result-btn{width:100%;padding:13px 0;border:none;border-radius:3px;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .16s;}
  .result-btn.ok{background:var(--blue);color:white;}
  .result-btn.ok:hover{background:#2e5a73;}
  .result-btn.warn{background:var(--cream);color:var(--ink);border:1px solid var(--border);}
  .result-btn.warn:hover{background:#e0dbd0;}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-title">図書貸出</div>
  <div class="loading-sub">データを読み込み中…</div>
</div>

<div class="app-wrap">
  <header class="header">
    <div class="header-left">
      <div class="header-title">図書貸出</div>
      <div class="header-sub">Book Lending</div>
    </div>
    <div class="header-right">
      <button class="sync-btn" id="sync-btn" onclick="syncAll()">↑↓ 同期</button>
      <button class="header-mgmt" onclick="openMgmt()">⚙ 管理</button>
    </div>
  </header>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="screen-owners" class="screen">
    <div class="section-label">持ち主を選択</div>
    <div id="owner-list"></div>
  </div>
  <div id="screen-books" class="screen hidden">
    <div class="section-label" id="books-label"></div>

      <button class="btn btn-danger"    style="flex:1" id="confirm-ok-btn">削除する</button>

<!-- 操作結果ポップアップ -->
<div class="result-overlay hidden" id="result-overlay">
  <div class="result-box">
    <div class="result-icon"  id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-body"  id="result-body"></div>
    <button class="result-btn" id="result-btn" onclick="closeResult()"></button>
  </div>

<script>
/* ════ GAS API ════ */
const GAS_URL="https://script.google.com/macros/s/AKfycbyamOSmlbHAaNafZk0JU33nww2U24a0a9R_wqc3zFGv1IK-WiDYmToDLvcZEGUFLB3JlQ/exec";
async function gasGet(){const res=await fetch(GAS_URL+"?action=getAll");return res.json();}
async function gasPost(body){const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(body)});return res.json();}
async function uploadImageToDrive(dataUrl,fileName){
  const result=await gasPost({action:"uploadImage",imageData:dataUrl,fileName:fileName});
  if(result.error)throw new Error(result.error);
  return result.url;
}

/* ════ データ ════ */
const EMOJI_POOL=["📗","📘","📙","📕","📓","📒","📔","📚"];
const defaultOwners=[{name:"山田",emoji:"📗"},{name:"佐藤",emoji:"📘"},{name:"鈴木",emoji:"📙"}];
const defaultBooks=[
  {id:1,owner:"山田",title:"AI入門",author:"",isbn:"",coverImage:null,emoji:"🤖",status:"available",borrower:""},
  {id:2,owner:"山田",title:"経済の基本",author:"",isbn:"",coverImage:null,emoji:"📊",status:"available",borrower:""},
  {id:3,owner:"佐藤",title:"環境政策の未来",author:"",isbn:"",coverImage:null,emoji:"🌿",status:"available",borrower:""},
  {id:4,owner:"鈴木",title:"都市計画概論",author:"",isbn:"",coverImage:null,emoji:"🏙️",status:"available",borrower:""}
];
let owners=[],books=[];
let currentOwner="",currentBookId=null;

/* ════ 起動 ════ */
async function init(){
  try{
    const data=await gasGet();
    owners=data.owners&&data.owners.length?data.owners:defaultOwners;
    books=data.books&&data.books.length?data.books.map(b=>({...b,id:Number(b.id)||Date.now()})):defaultBooks;
  }catch(e){
    owners=JSON.parse(localStorage.getItem("lending_owners")||"null")||defaultOwners;
    books=JSON.parse(localStorage.getItem("lending_books")||"null")||defaultBooks;
    showToast("オフラインモード：ローカルデータを使用中");
  }
  localStorage.setItem("lending_owners",JSON.stringify(owners));
  localStorage.setItem("lending_books",JSON.stringify(books));
  document.getElementById("loading-screen").classList.add("hidden");
  renderOwners();
  history.replaceState({screen:"screen-owners",owner:"",bookId:null},"","#screen-owners");
}

async function saveAll(){
  localStorage.setItem("lending_owners",JSON.stringify(owners));
  localStorage.setItem("lending_books",JSON.stringify(books));
  try{
    await gasPost({action:"saveOwners",owners});
    await gasPost({action:"saveBooks",books});
  }catch(e){showToast("⚠ オフライン：ローカルに保存しました");}
}

async function syncAll(){
  const btn=document.getElementById("sync-btn");
  btn.classList.add("syncing");btn.textContent="同期中…";
  try{
    const data=await gasGet();
    if(data.owners&&data.owners.length)owners=data.owners;
    if(data.books&&data.books.length)books=data.books.map(b=>({...b,id:Number(b.id)||Date.now()}));
    localStorage.setItem("lending_owners",JSON.stringify(owners));
    localStorage.setItem("lending_books",JSON.stringify(books));
    renderOwners();showToast("同期しました");
  }catch(e){showToast("同期失敗：ネットワークを確認してください");}
  btn.classList.remove("syncing");btn.textContent="↑↓ 同期";
}

/* ════ SVGカバー生成 ════ */
async function generateCoverSVG(title,author){
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:`本の表紙デザインをSVGで生成してください。書名：${title}　著者：${author||"不明"}。条件：viewBox="0 0 200 280"のSVG、書名の雰囲気に合った配色（2〜3色）、幾何学的パターンで装飾、書名テキストを中央に配置（日本語対応）、著者名を下部に小さく配置、シンプルで美しいデザイン。SVGタグのみ返してください。説明文不要。`}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(c=>c.type==="text")?.text||"";
    const match=text.match(/<svg[\s\S]*<\/svg>/i);
    if(match)return match[0];
  }catch(e){}
  return null;
}

/* ════ coverImage表示ヘルパー ════ */
function coverInnerHtml(b){
  if(!b.coverImage)return`<span>${b.emoji||"📖"}</span>`;
  if(b.coverImage.trimStart().startsWith("<svg"))return b.coverImage;
  return`<img src="${b.coverImage}" alt="${b.title}" onerror="this.parentNode.innerHTML='<span>📖</span>'">`;
}
function thumbHtml(b){
  return`<div class="book-thumb">${coverInnerHtml(b)}</div>`;
}

/* ════ ユーティリティ ════ */
function updateBreadcrumb(parts){
  const el=document.getElementById("breadcrumb");
  if(!parts||!parts.length){el.innerHTML="";return;}
  el.innerHTML=parts.map((p,i)=>i===parts.length-1?`<span class="current">${p.label}</span>`:`<span onclick="${p.action}">${p.label}</span><span class="sep">›</span>`).join("");
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
function showScreen(id,pushHistory=true){
  ["screen-owners","screen-books","screen-detail","screen-mgmt"].forEach(s=>{
    const el=document.getElementById(s);el.classList.add("hidden");el.classList.remove("screen");
  });
  const t=document.getElementById(id);t.classList.remove("hidden");void t.offsetWidth;t.classList.add("screen");
  if(pushHistory){
    history.pushState({screen:id,owner:currentOwner,bookId:currentBookId},"","#"+id);
  }
}

/* ════ 操作結果ポップアップ ════ */
let _resultCb=null;
function showResult(icon,title,body,btnLabel="OK",btnStyle="ok",onClose=null){
  document.getElementById("result-icon").textContent=icon;
  document.getElementById("result-title").textContent=title;
  document.getElementById("result-body").textContent=body;
  const btn=document.getElementById("result-btn");
  btn.textContent=btnLabel;
  btn.className="result-btn "+btnStyle;
  _resultCb=onClose;
  document.getElementById("result-overlay").classList.remove("hidden");
}
function closeResult(){
  document.getElementById("result-overlay").classList.add("hidden");
  if(_resultCb){_resultCb();_resultCb=null;}
}

/* ════ 画面1 ════ */
function renderOwners(){
  const list=document.getElementById("owner-list");list.innerHTML="";
  if(!owners.length){list.innerHTML='<div class="empty-state">所有者がいません<br>⚙ 管理から追加してください</div>';updateBreadcrumb([]);return;}
  owners.forEach(o=>{
    const owned=books.filter(b=>b.owner===o.name);
    const borrow=owned.filter(b=>b.status==="borrowed").length;
    const div=document.createElement("div");div.className="owner-card";
    div.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><span style="font-size:22px">${o.emoji}</span><span class="owner-name">${o.name}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="owner-count">${owned.length}冊${borrow>0?` · 貸出中${borrow}`:""}</span><span class="owner-arrow">›</span></div>`;
    div.onclick=()=>selectOwner(o.name);list.appendChild(div);
  });
  updateBreadcrumb([]);
}
function selectOwner(name){
  currentOwner=name;showScreen("screen-books");
  document.getElementById("books-label").textContent=name+" の蔵書";
  renderBooks();
  updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:name}]);
}

/* ════ 画面2 ════ */
function renderBooks(){
  const list=document.getElementById("book-list");list.innerHTML="";
  const my=books.filter(b=>b.owner===currentOwner);
  if(!my.length){list.innerHTML='<div class="empty-state">蔵書がありません</div>';return;}
  my.forEach(b=>{
    const div=document.createElement("div");div.className="book-card";
    div.innerHTML=`${thumbHtml(b)}<div class="book-info"><div class="book-title">${b.title}</div><div class="book-author">${b.author||""}</div><div class="book-meta">${b.status==="borrowed"?"→ "+b.borrower:"—"}</div></div><span class="badge ${b.status==="available"?"available":"borrowed"}">${b.status==="available"?"貸出可":"貸出中"}</span>`;
    div.onclick=()=>selectBook(b.id);list.appendChild(div);
  });
}
function selectBook(id){
  currentBookId=id;showScreen("screen-detail");
  const b=books.find(x=>x.id===id);
  updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:currentOwner,action:"backToBooks()"},{label:b.title}]);
  renderDetail();
}

/* ════ 画面3 ════ */
function renderDetail(){
  const b=books.find(x=>x.id===currentBookId);
  const card=document.getElementById("detail-card");
  const ok=b.status==="available";
  const cover=coverInnerHtml(b);
  card.innerHTML=`
    <div class="detail-cover-wrap"><div class="detail-cover">${cover}</div></div>
    <div class="detail-title">${b.title}</div>
    ${b.author?`<div class="detail-author">${b.author}</div>`:""}
    <div class="detail-owner">所有者：${b.owner}</div>
    <hr class="detail-divider">
    <div class="detail-row">
      <span class="detail-label">状態</span>
      <span class="badge ${ok?"available":"borrowed"}">${ok?"貸出可":"貸出中"}</span>
    </div>
    ${!ok?`<div class="detail-row"><span class="detail-label">借りている人</span><span class="detail-value">${b.borrower}</span></div>`:""}
    ${b.isbn?`<div class="detail-row"><span class="detail-label">ISBN</span><span style="font-family:'DM Mono',monospace;font-size:12px">${b.isbn}</span></div>`:""}
    <div class="input-wrap ${ok?"visible":""}" id="borrower-input-wrap">
      <div class="input-label">借りる人の名前</div>
      <input class="input-field" id="borrower-name" type="text" placeholder="名前を入力…" maxlength="20">
    </div>
    <div class="btn-group">
      <button class="btn btn-primary"   onclick="borrowBook()" ${!ok?"disabled":""}>借りる</button>
      <button class="btn btn-secondary" onclick="returnBook()" ${ ok?"disabled":""}>返却する</button>
    </div>
    <div class="delete-zone">
      <button class="btn-delete-sm" onclick="deleteBook(${b.id})">この本を登録から削除する</button>
    </div>`;
}

async function borrowBook(){
  const input=document.getElementById("borrower-name");
  const name=input?.value.trim()||"";
  if(!name){
    input.style.borderColor="var(--red)";
    setTimeout(()=>input.style.borderColor="",1500);
    showResult("✏️","名前を入力してください","借りる人の名前を入力してから\nボタンを押してください","閉じる","warn",()=>input.focus());
    return;
  }
  const b=books.find(x=>x.id===currentBookId);
  b.status="borrowed";b.borrower=name;
  renderDetail();renderBooks();
  showResult("📖","貸出しました",`「${b.title}」を\n${name} さんに貸出しました`);
  // 貸出履歴を追記
  const today=new Date().toISOString().slice(0,10);
  gasPost({action:"saveLoans",loans:[{
    bookId:   b.id,
    borrower: name,
    loanDate: today,
    returnDate: ""
  }]});
  saveAll();
}

async function returnBook(){
  const b=books.find(x=>x.id===currentBookId);
  const borrower=b.borrower;
  b.status="available";b.borrower="";
  renderDetail();renderBooks();
  showResult("✅","返却されました",`「${b.title}」が\n${borrower?borrower+" さんから":""}返却されました`);
  // 返却日を追記
  const today=new Date().toISOString().slice(0,10);
  gasPost({action:"saveLoans",loans:[{
    bookId:    b.id,
    borrower:  borrower,
    loanDate:  "",
    returnDate: today
  }]});
  saveAll();
}

function deleteBook(id){
  const b=books.find(x=>x.id===id);
  openConfirm(`「${b.title}」を削除`,`この本の登録をすべて削除します。`,()=>{
    books=books.filter(x=>x.id!==id);
    saveAll();showToast(`「${b.title}」を削除しました`);backToBooks();
  });
}

/* ════ 画面4：管理 ════ */
function openMgmt(){
  showScreen("screen-mgmt");
  updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:"管理"}]);
  renderMgmt();
}
function renderMgmt(){
  const list=document.getElementById("mgmt-owner-list");list.innerHTML="";
  if(!owners.length){list.innerHTML='<div class="empty-state" style="padding:24px 0">所有者がいません</div>';return;}
  owners.forEach(o=>{
    const owned=books.filter(b=>b.owner===o.name).length;
    const borrow=books.filter(b=>b.owner===o.name&&b.status==="borrowed").length;
    const div=document.createElement("div");div.className="owner-row";
    div.innerHTML=`<span class="owner-row-emoji">${o.emoji}</span><span class="owner-row-name">${o.name}</span><span class="owner-row-count">${owned}冊${borrow?` · 貸出中${borrow}`:""}</span><button class="owner-row-del" onclick="confirmDeleteOwner('${o.name}')" ${borrow>0?'disabled title="貸出中の本があるため削除できません"':""}>削除</button>`;
    list.appendChild(div);
  });
}
function addOwner(){
  const input=document.getElementById("new-owner-input");
  const name=input.value.trim();
  if(!name){input.focus();return;}
  if(owners.find(o=>o.name===name)){showToast("同名の所有者がすでにいます");return;}
  owners.push({name,emoji:EMOJI_POOL[owners.length%EMOJI_POOL.length]});
  saveAll();input.value="";renderMgmt();renderOwners();showToast(`「${name}」を追加しました`);
}
function confirmDeleteOwner(name){
  const owned=books.filter(b=>b.owner===name).length;
  openConfirm(`「${name}」を削除`,`この所有者と登録されている ${owned} 冊の本をすべて削除します。この操作は取り消せません。`,()=>{
    owners=owners.filter(o=>o.name!==name);books=books.filter(b=>b.owner!==name);
    saveAll();renderMgmt();showToast(`「${name}」を削除しました`);
  });
}

/* ════ 確認ダイアログ ════ */
let _cb=null;
function openConfirm(title,body,onOk){
  document.getElementById("confirm-title").textContent=title;
  document.getElementById("confirm-body").textContent=body;
  _cb=onOk;document.getElementById("confirm-overlay").classList.remove("hidden");
}
function closeConfirm(){document.getElementById("confirm-overlay").classList.add("hidden");_cb=null;}
document.getElementById("confirm-ok-btn").onclick=()=>{if(_cb)_cb();closeConfirm();};

/* ════ ナビ ════ */
function backToOwners(){showScreen("screen-owners");renderOwners();}
function backToBooks(){
  showScreen("screen-books");renderBooks();
  updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:currentOwner}]);
}

/* ════ スキャナー ════ */
let html5QrCode=null,scannedIsbn=null,pendingBook=null,capturedPhotoDataUrl=null;

function resetModal(){
  scannedIsbn=null;pendingBook=null;capturedPhotoDataUrl=null;
  setStatus("","");
  document.getElementById("lookup-state").classList.remove("active");
  document.getElementById("book-preview").classList.remove("active");
  document.getElementById("photo-capture-area").classList.remove("active");
  document.getElementById("photo-preview-wrap").classList.remove("active");
  document.getElementById("photo-uploading").classList.remove("active");
  document.getElementById("photo-preview-img").src="";
  document.getElementById("manual-title").value="";
  document.getElementById("manual-author").value="";
  document.getElementById("register-confirm-btn").disabled=true;
  document.getElementById("rescan-btn").classList.remove("active");
  document.getElementById("scanner-stopped").classList.remove("active");
  document.getElementById("qr-reader").style.display="block";
  document.getElementById("modal-sub").textContent="バーコード（ISBN）をカメラに向けてください";
  document.getElementById("photo-file-input").value="";
  document.getElementById("manual-title").oninput=syncBtn;
}
function syncBtn(){
  document.getElementById("register-confirm-btn").disabled=
    !(pendingBook||document.getElementById("manual-title").value.trim());
}
function setStatus(msg,cls){
  const el=document.getElementById("scanner-status");
  el.textContent=msg;el.className="scanner-status"+(cls?" "+cls:"");
}

async function openRegisterModal(){
  resetModal();
  document.getElementById("register-modal").classList.remove("hidden");
  await startScanner();
}
function closeRegisterModal(){
  stopScanner();
  document.getElementById("register-modal").classList.add("hidden");
  const qr=document.getElementById("qr-reader");
  qr.innerHTML="";qr.style.display="block";
  document.getElementById("scanner-stopped").classList.remove("active");
}
async function startScanner(){
  html5QrCode=new Html5Qrcode("qr-reader");
  try{
    await html5QrCode.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:100},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128]},
      onScanSuccess,()=>{}
    );
  }catch(e){setStatus(`カメラを起動できませんでした：${e.message||e}`,"error");}
}
function stopScanner(){
  if(html5QrCode){
    try{html5QrCode.stop().catch(()=>{});html5QrCode.clear();}catch(_){}
    html5QrCode=null;
  }
  scannedIsbn=null;
}
async function restartScanner(){
  pendingBook=null;scannedIsbn=null;capturedPhotoDataUrl=null;
  document.getElementById("book-preview").classList.remove("active");
  document.getElementById("photo-capture-area").classList.remove("active");
  document.getElementById("photo-preview-wrap").classList.remove("active");
  document.getElementById("rescan-btn").classList.remove("active");
  document.getElementById("scanner-stopped").classList.remove("active");
  const qr=document.getElementById("qr-reader");
  qr.innerHTML="";qr.style.display="block";
  document.getElementById("register-confirm-btn").disabled=true;
  document.getElementById("manual-title").value="";
  document.getElementById("manual-author").value="";
  setStatus("","");
  document.getElementById("modal-sub").textContent="バーコード（ISBN）をカメラに向けてください";
  await startScanner();
}
function onScanSuccess(text){
  if(!/^(978|979)\d{10}$/.test(text)&&!/^\d{9}[\dX]$/.test(text))return;
  if(text===scannedIsbn)return;
  scannedIsbn=text;
  html5QrCode.stop().then(()=>{
    html5QrCode.clear();html5QrCode=null;
    document.getElementById("qr-reader").style.display="none";
    document.getElementById("scanner-stopped").classList.add("active");
    document.getElementById("scanner-stopped-msg").textContent=`ISBN: ${text}`;
    fetchBookInfo(text);
  }).catch(()=>{fetchBookInfo(text);});
}

/* ════ 書誌情報取得 ＋ SVGカバー生成 ════ */
async function fetchBookInfo(isbn){
  setStatus("書誌情報を取得中…","found");
  document.getElementById("lookup-state").classList.add("active");
  document.getElementById("lookup-msg").textContent="書誌情報を取得中…";
  document.getElementById("modal-sub").textContent="書誌情報を取得中…";
  try{
    const ob=await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
    const od=await ob.json();
    const summary=od?.[0]?.summary;
    if(!summary?.title)throw new Error("書誌情報が見つかりませんでした");
    const title=summary.title||"";
    const author=summary.author||"";
    let coverImage=summary.cover||null;
    if(!coverImage){
      document.getElementById("lookup-msg").textContent="表紙画像を生成中…";
      setStatus("表紙画像を生成中…","found");
      const svg=await generateCoverSVG(title,author);
      if(svg)coverImage=svg;
    }
    document.getElementById("lookup-state").classList.remove("active");
    pendingBook={title,author,isbn,coverImage};
    showPreview(pendingBook);
    setStatus(`「${title}」を取得しました ✓`,"found");
    document.getElementById("modal-sub").textContent="内容を確認して登録してください";
    document.getElementById("rescan-btn").classList.add("active");
    document.getElementById("photo-capture-area").classList.add("active");
    syncBtn();
  }catch(e){
    document.getElementById("lookup-state").classList.remove("active");
    setStatus(`取得失敗 — 手動入力してください (${e.message})`,"error");
    document.getElementById("modal-sub").textContent="手動でタイトルを入力してください";
    document.getElementById("rescan-btn").classList.add("active");
    document.getElementById("photo-capture-area").classList.add("active");
    document.getElementById("manual-title").focus();
  }
}

function showPreview(book){
  const cover=document.getElementById("preview-cover");
  let inner="";
  if(book.coverImage){
    if(book.coverImage.trimStart().startsWith("<svg")){inner=book.coverImage;}
    else{inner=`<img src="${book.coverImage}" alt="${book.title}">`;}
  }else{inner="📖";}
  cover.innerHTML=inner+`<div class="preview-cover-hint"><span>📷</span></div>`;
  document.getElementById("preview-title").textContent=book.title;
  document.getElementById("preview-author").textContent=book.author||"";
  document.getElementById("preview-isbn").textContent=`ISBN ${book.isbn}`;
  document.getElementById("book-preview").classList.add("active");
  document.getElementById("manual-title").value=book.title;
  document.getElementById("manual-author").value=book.author||"";
}

/* ════ 写真撮影 → Driveアップロード ════ */
async function onPhotoSelected(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const dataUrl=e.target.result;
    const img=new Image();
    img.onload=async()=>{
      const MAX=600;
      const scale=MAX/Math.min(img.width,img.height);
      const w=Math.round(img.width*scale);
      const h=Math.round(img.height*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      capturedPhotoDataUrl=canvas.toDataURL("image/jpeg",0.80);
      document.getElementById("photo-preview-img").src=capturedPhotoDataUrl;
      document.getElementById("photo-preview-wrap").classList.add("active");
      document.getElementById("photo-uploading").classList.add("active");
      document.getElementById("register-confirm-btn").disabled=true;
      try{
        const fileName=`cover_${Date.now()}.jpg`;
        const driveUrl=await uploadImageToDrive(capturedPhotoDataUrl,fileName);
        capturedPhotoDataUrl=driveUrl;
        if(pendingBook){pendingBook.coverImage=driveUrl;showPreview(pendingBook);}
        document.getElementById("photo-uploading").classList.remove("active");
        showToast("表紙写真をアップロードしました");
        syncBtn();
      }catch(err){
        document.getElementById("photo-uploading").classList.remove("active");
        showToast("アップロード失敗：写真なしで登録されます");
        capturedPhotoDataUrl=null;
        syncBtn();
      }
    };
    img.src=dataUrl;
  };
  reader.readAsDataURL(file);
}

function clearPhoto(){
  capturedPhotoDataUrl=null;
  document.getElementById("photo-preview-img").src="";
  document.getElementById("photo-preview-wrap").classList.remove("active");
  document.getElementById("photo-file-input").value="";
  if(pendingBook&&scannedIsbn){fetchBookInfo(scannedIsbn);}
}

/* ════ 登録確定 ════ */
async function confirmRegister(){
  const title=document.getElementById("manual-title").value.trim()||pendingBook?.title||"";
  const author=document.getElementById("manual-author").value.trim()||pendingBook?.author||"";
  const isbn=pendingBook?.isbn||"";
  const cover=capturedPhotoDataUrl||pendingBook?.coverImage||null;
  if(!title)return;
  document.getElementById("register-confirm-btn").disabled=true;
  document.getElementById("register-confirm-btn").textContent="保存中…";
  books.push({id:Date.now(),owner:currentOwner,title,author,isbn,coverImage:cover,emoji:"📖",status:"available",borrower:""});
  closeRegisterModal();
  renderBooks();
  // ポップアップを即座に表示
  showResult("📚","登録しました",`「${title}」を\n${currentOwner} の蔵書に登録しました`);
  // 保存はバックグラウンドで実行
  saveAll();
}

/* ════ 初期化 ════ */
init();
document.getElementById("new-owner-input").addEventListener("keydown",e=>{if(e.key==="Enter")addOwner();});

/* ════ 戻るボタン対応 ════ */
window.addEventListener("popstate",(e)=>{
  if(!document.getElementById("register-modal").classList.contains("hidden")){
    closeRegisterModal();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  if(!document.getElementById("confirm-overlay").classList.contains("hidden")){
    closeConfirm();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  if(!document.getElementById("result-overlay").classList.contains("hidden")){
    closeResult();
    history.pushState({screen:getCurrentScreen(),owner:currentOwner,bookId:currentBookId},"","#"+getCurrentScreen());
    return;
  }
  const state=e.state;
  if(!state){showScreen("screen-owners",false);renderOwners();return;}
  currentOwner=state.owner||"";
  currentBookId=state.bookId||null;
  switch(state.screen){
    case "screen-owners":
      showScreen("screen-owners",false);renderOwners();break;
    case "screen-books":
      showScreen("screen-books",false);
      document.getElementById("books-label").textContent=currentOwner+" の蔵書";
      renderBooks();
      updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:currentOwner}]);
      break;
    case "screen-detail":
      if(!currentBookId){showScreen("screen-books",false);renderBooks();return;}
      showScreen("screen-detail",false);
      renderDetail();
      const b=books.find(x=>x.id===currentBookId);
      if(b)updateBreadcrumb([
        {label:"持ち主一覧",action:"backToOwners()"},
        {label:currentOwner,action:"backToBooks()"},
        {label:b.title}
      ]);
      break;
    case "screen-mgmt":
      showScreen("screen-mgmt",false);
      updateBreadcrumb([{label:"持ち主一覧",action:"backToOwners()"},{label:"管理"}]);
      renderMgmt();
      break;
  }
});

function getCurrentScreen(){
  return["screen-owners","screen-books","screen-detail","screen-mgmt"].find(s=>!document.getElementById(s).classList.contains("hidden"))||"screen-owners";
}
